<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>

  <!-- Bootstrap 5.3 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    div { opacity: 0.9;}
    body {
      height: 100vh;
      margin: 0;
      background: url('/static/horse.jpg')  center center fixed;
      background-size: cover;
    }

    .login-card {
      backdrop-filter: blur(10px);
      background: rgba(255, 255, 255, 0.85);
      border-radius: 12px;
      padding: 2rem;
      box-shadow: 0 8px 25px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>

  <div class="d-flex justify-content-center align-items-center h-100">
    <div class="login-card col-10 col-sm-8 col-md-4">

      <h4 class="text-center mb-4">Enter Password</h4>

      <form action="/admin" method="Post">
        <div class="mb-3">
          <input type="password" class="form-control form-control-lg" placeholder="Password" name="password" id="password" required>
        </div>

        <div class="d-grid">
          <button type="submit" class="btn btn-primary btn-lg">Log In</button>
        </div>
      </form>

    </div>
  </div>

</body>
</html>
