<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Students</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
    body {
        background: url('/static/running.png') no-repeat center center / cover fixed;  opacity: 0.7;    
    }
    </style>
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow-sm mx-auto" style="max-width: 600px;">
        <div class="card-header bg-danger text-white">
            <h5 class="mb-0">Manage Student Notification</h5>
        </div>
        <div class="card-body">
            <p class="text-muted small">To unsubcribe students, check student names.</p>
            
            <!-- FORM ACTION points to your Go handler -->
            <form action="/ds" method="POST">
                
                <!-- Student Selection Table -->
                <div class="table-responsive border rounded mb-3 bg-white">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th scope="col" style="width: 40px;">
                                    <input class="form-check-input" type="checkbox" id="selectAll">
                                </th>
                                <th scope="col">Student Name</th>
                            </tr>
                        </thead>
                        <tbody>                    
                             {{ range .}}
                            <tr>
                                <td>
                                    <input class="form-check-input item-checkbox" type="checkbox" name="sids" value="{{.Id}}" >
                                </td>
                                <td>
                                    <label class="form-check-label d-block w-100 py-1" >
                                        {{.Name}}
                                    </label>
                                </td>
                            </tr>                            
                       
                            {{end}}
                        </tbody>
                    </table>
                </div>

            
                <div class="d-flex justify-content-end gap-2">
                    <a href="/teachers" class="btn btn-outline-secondary">Cancel</a>
                   
                    <button type="submit"  {{if eq (len .) 0}} disabled {{end}} class="btn btn-danger" onclick="return confirm('Are you sure you want to delete the selected students?');">
                        Unsubcribe
                    </button>
                </div>
            </form>

        </div>
    </div>
</div>


<script>
    document.getElementById('selectAll').addEventListener('change', function() {
        const checkboxes = document.querySelectorAll('.item-checkbox');
        checkboxes.forEach(cb => cb.checked = this.checked);
    });
</script>

</body>
</html>
