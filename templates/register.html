<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <!-- Bootstrap 5 CSS (correct CDN) -->
   <style>
    div {                
         opacity: 0.92;         
    }
    body {
    /* Replace with your image URL */
    background: url('/static/register.jpg') no-repeat center center / cover fixed;     
  }</style>
</head>
<body class="pt-5">
    <nav class="navbar navbar-dark bg-dark fixed-top shadow">
        <div class="container-fluid">
          <a class="navbar-brand fw-bold fs-4" href="/">
            Famlink
          </a>
        </div>
      </nav>
      <div class="container py-5">
        <h1 class="text-center" style="color:red">{{.District}}</h1>
        <div class="row justify-content-center">
          <div class="col-md-5 col-lg-4">      
            <div class="card shadow-sm">
              <div class="card-body p-4">
                <h4 class="mb-4 text-center">Parent registers</h4>               
                <div id="errorBox" class="alert alert-danger d-none"></div>     
                <form method="POST" action="/register" novalidate>
                  <div class="form-floating mb-3">
                    <input type="text" class="form-control" value="{{.First}}" id="firstname" name="firstname" placeholder="First Name" required minlength="2">
                    <label for="firstname">First Name</label>
                    <div class="invalid-feedback">
                      First name must be at least 2 characters.
                    </div>
                  </div>
                  <div class="form-floating mb-3">
                    <input type="text" class="form-control" value="{{.Last}}" id="lastname" name="lastname" placeholder="Last Name" required minlength="2">
                    <label for="lastname">Last Name</label>
                    <div class="invalid-feedback">
                      Last name must be at least 2 characters.
                    </div>
                  </div>                  
                  <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="username" name="username" placeholder="Username" required minlength="6">
                    <label for="username">Username</label>
                    <div class="invalid-feedback">
                      Username must be at least 6 characters.
                    </div>
                  </div>      
                  <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="password" name="password" placeholder="Password" required minlength="6">
                    <label for="password">Password</label>
                    <div class="invalid-feedback">
                      Password must be at least 6 characters.
                    </div>
                    <span class="text-danger">Please write down username and password</span>
                  </div>      
                  <button class="btn btn-primary w-100" type="submit">
                    Register
                  </button>
                  <span class="text-danger">{{.Error}}</span>
                </form>
              </div>
            </div>      
          </div>
        </div>      
      <script>
      
      (() => {
        'use strict'
        const forms = document.querySelectorAll('form');
      
        Array.from(forms).forEach(form => {
          form.addEventListener('submit', event => {
            if (!form.checkValidity()) {
              event.preventDefault();
              event.stopPropagation();
            }
            form.classList.add('was-validated');
          }, false)
        })
      })();
      
      function showError(message) {
        const box = document.getElementById('errorBox');
        box.textContent = message;
        box.classList.remove('d-none');
      }         
      </script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
