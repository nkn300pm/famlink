<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <!-- Bootstrap 5 CSS (correct CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <style>
        body {
        background: url('/static/running.png') no-repeat center center / cover fixed;  opacity: 0.7;    
    }
 
    </style>
</head>
<body class="pt-5">
    <nav class="navbar navbar-dark bg-dark fixed-top shadow">
        <div class="container-fluid">
          <a class="navbar-brand fw-bold fs-4" href="/">
            Famlink
          </a>
        </div>
      </nav>
<div class="container mt-5">
    <h1 class="text-center">{{.District}}</h1>
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-lg">
                <div class="card-body">
                    <h3 class="card-title text-center">Login</h3>
                    <form action="/teachers" method="POST">
                        <!-- Email Input -->
                        <div class="mb-3">
                            <div class="form-floating">
                                <input type="text" value="{{.Username}}" class="form-control" id="username" name="username" placeholder="User Name" required>  
                                <label for="username">User Name</label>                            
                            </div>
                        </div>
                             
                        <div class="mb-3">
                            <div class="form-floating">
                                <input type="password" class="form-control" id="password" name="password" placeholder="password" required>   
                                <label for="password">Password</label>                              
                            </div>
                        </div>
                        <!-- Submit Button -->
                        <div class="mb-3 text-center">
                            <button type="submit" class="btn btn-primary">Login</button>
                        </div>
                        <div>{{.Error}}</div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"  crossorigin="anonymous"></script>
</body>
</html>
